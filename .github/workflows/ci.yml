name: CI check (Windows + Linux)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: windows-latest
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: i18n completeness (t() keys vs fa.json)
        run: npm run check:i18n

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build frontend — TS edition
        run: npm run build

      - name: Build frontend — Rust edition
        run: npm run build:rust

      - name: Cargo check (app crate incl. ketabyar-core)
        run: cargo check
        working-directory: src-tauri

  core-tests:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: ubuntu-latest
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/core

      - name: ketabyar-core integration tests
        run: cargo test --release
        working-directory: src-tauri/core
