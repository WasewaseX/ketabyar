name: Release KetabYar (both editions, Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write # create the release and upload installer assets
    strategy:
      fail-fast: false
      matrix:
        settings:
          # TypeScript edition — SQL runs in the webview via tauri-plugin-sql
          - platform: windows-latest
            args: ''
          # Rust edition — SQL runs natively in ketabyar-core (rusqlite)
          - platform: windows-latest
            args: '--config src-tauri/tauri.rust.conf.json'
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            src-tauri/core

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the release exists (both matrix jobs race on it)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash # Windows default is pwsh — this script is bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "Release tag: $TAG"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Pre-create so tauri-action never races its own find-or-create
            # across the two parallel publish jobs (v1.2.5: the Rust job hit
            # "already_exists" on create and died before uploading its asset).
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "KetabYar v${TAG#v}" \
              --notes "KetabYar installers — TS Edition (KetabYar_*) and Rust Edition with the native ketabyar-core engine (KetabYarRust_*). MIT. Default PIN: 6767" \
              || true
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null

      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0 (2025-11)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'KetabYar v__VERSION__'
          releaseBody: >-
            کتابیار — مدیریت کتابخانهٔ دانشگاه، آفلاین و تحت مجوز MIT.
            دو نسخه: TS Edition (فایل‌های KetabYar_*) و Rust Edition با موتور
            بومی ketabyar-core (فایل‌های KetabYarRust_*). | Two editions:
            TS (KetabYar_*) and Rust with the native ketabyar-core engine
            (KetabYarRust_*). MIT-licensed. Default PIN: 6767
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.settings.args }}
