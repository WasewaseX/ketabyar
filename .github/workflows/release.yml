name: Release KetabYar (Windows .exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          # TypeScript edition — SQL runs in the webview via tauri-plugin-sql
          - platform: windows-latest
            args: ''
          # Rust edition — SQL runs natively in ketabyar-core (rusqlite)
          - platform: windows-latest
            args: '--config src-tauri/tauri.rust.conf.json'
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'KetabYar v__VERSION__'
          releaseBody: 'کتابیار — مدیریت کتابخانه دانشگاه (آفلاین). دو نسخه: TS Edition (KetabYar_*) و Rust Edition (KetabYarRust_*). | Two editions: TS (KetabYar_*) and Rust (KetabYarRust_*). Default PIN: 6767'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.settings.args }}
